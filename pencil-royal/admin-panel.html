<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Pencil Royal</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .admin-header {
      background: linear-gradient(135deg, #d4af37 0%, #e6c750 100%);
      color: #333;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .admin-header h1 {
      margin: 0;
      font-size: 32px;
    }
    .admin-header p {
      margin: 10px 0 0 0;
      opacity: 0.9;
    }
    .schools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .school-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      border-left: 4px solid #1a3c5e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .school-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(-4px);
    }
    .school-card h3 {
      margin: 0 0 10px 0;
      color: #1a3c5e;
      font-size: 18px;
    }
    .school-card p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }
    .school-card .btn {
      margin-top: 15px;
      display: inline-block;
      padding: 8px 16px;
      background: #1a3c5e;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .school-card .btn:hover {
      background: #0d1f2d;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1;
      margin-right: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="container">
      <div class="logo">Pencil Royal</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="admin-panel.html" class="active">Admin Panel</a>
        <button id="logoutBtn" class="btn outline">Logout</button>
      </nav>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-header">
      <h1>Admin Panel</h1>
      <p>Manage all schools and competitions.</p>
    </div>

    <div class="nav-bar">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search schools by name or location..."
          onkeyup="filterSchools()"
        >
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <a href="admin-panel.html" style="padding: 10px 20px; background: #1a3c5e; color: white; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">📋 Schools</a>
      <a href="admin-school-verification.html" style="padding: 10px 20px; background: #667eea; color: white; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">🔐 Verify Schools</a>
      <a href="admin-intercompitions.html" style="padding: 10px 20px; background: #667eea; color: white; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">⚡ Competitions</a>
    </div>

    <h2 style="color: #1a3c5e; margin-bottom: 20px;">All Schools</h2>
    <div id="schoolsContainer" class="schools-grid">
      <p style="text-align: center; color: #666;">Loading schools...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    let allSchools = [];

    async function init() {
      try {
        // Check if user is logged in
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        // Check if user is admin using the new role-based system
        const isAdmin = await isUserAdmin(user.id);

        if (!isAdmin) {
          // Show message that they need to be admin
          document.querySelector('main').innerHTML = `
            <div style="max-width: 600px; margin: 50px auto; padding: 30px; background: #ffe6e6; border-radius: 8px; border-left: 4px solid #dc3545;">
              <h2 style="color: #dc3545; margin: 0 0 15px 0;">❌ Access Denied</h2>
              <p style="color: #666; margin: 10px 0;">
                Your account is not an admin account.
              </p>
              <p style="color: #666; margin: 10px 0;">
                <strong>Your email:</strong> ${user.email}
              </p>
              <p style="color: #666; margin: 15px 0;">
                To become an admin, contact your system administrator and have them run this script in Supabase SQL Editor:
              </p>
              <pre style="background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px;">
INSERT INTO user_roles (user_id, role)
SELECT auth.uid(), 'admin'
WHERE NOT EXISTS (
  SELECT 1 FROM user_roles 
  WHERE user_id = auth.uid()
);</pre>
              <button onclick="logout()" style="margin-top: 20px; padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Logout
              </button>
            </div>
          `;
          return;
        }

        // User is admin - show admin panel
        console.log('Admin authenticated:', user.email);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadAllSchools();
      } catch (err) {
        console.error('Init error:', err);
        showAlert('error', 'Error: ' + err.message);
      }
    }

    async function loadAllSchools() {
      try {
        const sb = await getSupabase();
        
        const { data: schools, error } = await sb.from('schools').select('*').order('name');
        
        if (error) {
          showAlert('error', 'Error loading schools: ' + error.message);
          return;
        }

        allSchools = schools || [];
        renderSchools(allSchools);
      } catch (err) {
        console.error('Error:', err);
        showAlert('error', 'Failed to load schools: ' + err.message);
      }
    }

    function renderSchools(schools) {
      const container = document.getElementById('schoolsContainer');
      
      if (!schools || schools.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">No schools found.</p>';
        return;
      }

      container.innerHTML = schools.map(school => `
        <div class="school-card">
          <h3>${school.name}</h3>
          <p>${school.location || 'Location TBA'}</p>
          <p>Status: <span style="color: ${school.approved ? '#27ae60' : '#e74c3c'}; font-weight: 600;">
            ${school.approved ? 'Approved' : 'Pending'}
          </span></p>
          <button
            class="btn"
            onclick="editSchoolCompetitions('${school.id}', '${school.name}')"
          >
            Edit Competitions
          </button>
          <button 
            class="btn" 
            style="background: #d4af37; color: #333; margin-left: 10px;"
            onclick="editSchoolDetails('${school.id}')"
          >
            Edit Details
          </button>
          <button 
            class="btn" 
            style="background: #28a745; margin-left: 10px;"
            onclick="viewSchoolDetails('${school.id}')"
          >
            View Details
          </button>
        </div>
      `).join('');
    }

    function filterSchools() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allSchools.filter(school => 
        school.name.toLowerCase().includes(searchTerm) || 
        (school.location && school.location.toLowerCase().includes(searchTerm))
      );
      renderSchools(filtered);
    }

    function editSchoolCompetitions(schoolId, schoolName) {
      // Redirect to admin intercompitions page
      console.log('🔗 Navigating to edit competitions...');
      console.log('School ID:', schoolId);
      console.log('School Name:', schoolName);
      
      if (!schoolId) {
        console.error('❌ School ID is empty!');
        showAlert('error', 'School ID is missing');
        return;
      }
      
      const url = `admin-intercompitions.html?school=${schoolId}&name=${encodeURIComponent(schoolName)}`;
      console.log('URL:', url);
      window.location.href = url;
    }

    function editSchoolDetails(schoolId) {
      // Redirect to admin school details editor
      window.location.href = `admin-school-details.html?school=${schoolId}`;
    }

    function viewSchoolDetails(schoolId) {
      window.location.href = `school-detail.html?school=${schoolId}`;
    }

    // Initialize on load
    window.addEventListener('load', init);
  </script>
</body>
</html>
